# main'e açılan her PR yapıyı (APP_BUILD) artırır; sürüm (APP_VERSION) geri gitmez, yayına gönderilen sürümden
# (en yüksek yayin-* etiketi) büyüktür ve ondan en fazla bir adım (patch / minor / major) ileridedir: mağazada sayı atlanmaz.
# Bilinçli sıfırlama yalnızca PR'da "surum-sifirla" etiketi varken geçer (SETUP.md → Sürüm)
name: Sürüm

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  surum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sürüm ve yapı
        env:
          BASE: ${{ github.base_ref }}
          SIFIRLA: ${{ contains(github.event.pull_request.labels.*.name, 'surum-sifirla') }}
        run: |
          ver() { sed -n "s/^self.APP_VERSION = '\([0-9]*\.[0-9]*\.[0-9]*\)';.*/\1/p"; }
          yapi() { sed -n "s/^self.APP_BUILD = \([0-9]*\);.*/\1/p"; }
          buyuk() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }   # $1 > $2
          head=$(ver < version.js); hb=$(yapi < version.js)
          base=$(git show "origin/$BASE:version.js" 2>/dev/null | ver || true)
          bb=$(git show "origin/$BASE:version.js" 2>/dev/null | yapi || true)
          rel=$(git tag -l 'yayin-*' | sed 's/^yayin-//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "main: ${base:-yok} (yapı ${bb:-yok}), bu PR: $head (yapı $hb), yayında: ${rel:-yok}"
          if [ -z "$head" ] || [ -z "$hb" ]; then echo "::error file=version.js::APP_VERSION ya da APP_BUILD okunamadı"; exit 1; fi
          if ! grep -q "^// Sürüm $head (yapı $hb) " sw.js; then
            echo "::error file=sw.js::sw.js'teki sürüm satırı version.js ile aynı değil ($head, yapı $hb). scripts/surum.sh ikisini birlikte yazar."
            exit 1
          fi
          if grep "MARKETING_VERSION = " ios/CashFollow.xcodeproj/project.pbxproj | grep -qv "MARKETING_VERSION = $head;"; then
            echo "::error file=ios/CashFollow.xcodeproj/project.pbxproj::iOS MARKETING_VERSION version.js ile aynı değil ($head). scripts/surum.sh ikisini birlikte yazar."
            exit 1
          fi
          hata=0
          # Her PR yapıyı artırır (web önbelleği yenilensin)
          if [ -n "$bb" ] && [ "$hb" -le "$bb" ]; then
            echo "::error file=version.js::Yapı artırılmalı (main: $bb, bu PR: $hb). scripts/surum.sh [patch|minor|major] çalıştır."; hata=1
          fi
          # Sürüm geri gitmez
          if [ -n "$base" ] && buyuk "$base" "$head"; then
            if [ "$SIFIRLA" = "true" ]; then echo "::warning file=version.js::Sürüm sıfırlandı (main: $base, bu PR: $head): surum-sifirla etiketi"
            else echo "::error file=version.js::Sürüm geri gidemez (main: $base, bu PR: $head)"; hata=1; fi
          fi
          # Yayına gönderilen sürümün üstünde olmalı (o numaraya yeni build yüklenemez)
          if [ -n "$rel" ] && ! buyuk "$head" "$rel"; then
            echo "::error file=version.js::$rel yayına gönderildi, sürüm ondan büyük olmalı (bu PR: $head). scripts/surum.sh [patch|minor|major] çalıştır."; hata=1
          fi
          # Yayından bu yana birden fazla adım atlanmasın (1.3.4 yayındayken 1.3.6 olmaz)
          if [ -n "$rel" ] && [ -n "$base" ] && [ "$head" != "$base" ] && [ "$SIFIRLA" != "true" ]; then
            ok=$(echo "$rel" | awk -F. '{ print $1 "." $2 "." $3 + 1; print $1 "." $2 + 1 ".0"; print $1 + 1 ".0.0" }' | grep -cx "$head" || true)
            [ "$ok" = 1 ] || { echo "::error file=version.js::Sürüm $head, yayındaki $rel'den bir adım ileri değil ($rel'in sonraki patch / minor / major'ı olmalı). scripts/surum.sh çalıştır."; hata=1; }
          fi
          exit $hata
