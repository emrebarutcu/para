# main'e açılan her PR sürümü (version.js) main'dekinden büyük yapmalı. Bilinçli sıfırlama (ör. App Store'da ilk yayın
# için 8.15.1 → 1.0.0) yalnızca PR'da "surum-sifirla" etiketi varken geçer (SETUP.md → Sürüm)
name: Sürüm

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  surum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sürüm artırıldı mı
        env:
          BASE: ${{ github.base_ref }}
          SIFIRLA: ${{ contains(github.event.pull_request.labels.*.name, 'surum-sifirla') }}
        run: |
          ver() { sed -n "s/^self.APP_VERSION = '\([0-9]*\.[0-9]*\.[0-9]*\)';.*/\1/p"; }
          head=$(ver < version.js)
          base=$(git show "origin/$BASE:version.js" 2>/dev/null | ver || true)
          echo "main: ${base:-yok}, bu PR: $head"
          if [ -z "$head" ]; then echo "::error file=version.js::Sürüm okunamadı"; exit 1; fi
          if ! grep -q "^// Sürüm $head " sw.js; then
            echo "::error file=sw.js::sw.js'teki sürüm satırı version.js ile aynı değil ($head). scripts/surum.sh ikisini birlikte yazar."
            exit 1
          fi
          if grep "MARKETING_VERSION = " ios/CashFollow.xcodeproj/project.pbxproj | grep -qv "MARKETING_VERSION = $head;"; then
            echo "::error file=ios/CashFollow.xcodeproj/project.pbxproj::iOS MARKETING_VERSION version.js ile aynı değil ($head). scripts/surum.sh ikisini birlikte yazar."
            exit 1
          fi
          if [ -n "$base" ] && { [ "$head" = "$base" ] || [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)" != "$head" ]; }; then
            if [ "$SIFIRLA" = "true" ] && [ "$head" != "$base" ]; then
              echo "::warning file=version.js::Sürüm sıfırlandı (main: $base, bu PR: $head): surum-sifirla etiketi"
              exit 0
            fi
            echo "::error file=version.js::Sürüm artırılmalı (main: $base, bu PR: $head). scripts/surum.sh [patch|minor|major] çalıştır."
            exit 1
          fi
