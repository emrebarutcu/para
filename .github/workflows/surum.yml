# main'e açılan her PR sürümü (version.js) main'dekinden büyük yapmalı
name: Sürüm

on:
  pull_request:
    branches: [main]

jobs:
  surum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sürüm artırıldı mı
        env:
          BASE: ${{ github.base_ref }}
        run: |
          ver() { sed -n "s/^self.APP_VERSION = '\([0-9]*\.[0-9]*\.[0-9]*\)';.*/\1/p"; }
          head=$(ver < version.js)
          base=$(git show "origin/$BASE:version.js" 2>/dev/null | ver || true)
          echo "main: ${base:-yok}, bu PR: $head"
          if [ -z "$head" ]; then echo "::error file=version.js::Sürüm okunamadı"; exit 1; fi
          if ! grep -q "^// Sürüm $head " sw.js; then
            echo "::error file=sw.js::sw.js'teki sürüm satırı version.js ile aynı değil ($head). scripts/surum.sh ikisini birlikte yazar."
            exit 1
          fi
          # iPhone'un mağaza sürümü web'den ayrı (scripts/surum.sh ios): Debug ve Release aynı, biçim 1.0 / 1.0.1
          ios=$(sed -n "s/.*MARKETING_VERSION = \(.*\);.*/\1/p" ios/CashFollow.xcodeproj/project.pbxproj | sort -u)
          if ! echo "$ios" | grep -qxE '[0-9]+\.[0-9]+(\.[0-9]+)?'; then
            echo "::error file=ios/CashFollow.xcodeproj/project.pbxproj::iOS MARKETING_VERSION tek ve 1.0 / 1.0.1 biçiminde olmalı: $ios"
            exit 1
          fi
          echo "iPhone mağaza sürümü: $ios"
          if [ -n "$base" ] && { [ "$head" = "$base" ] || [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)" != "$head" ]; }; then
            echo "::error file=version.js::Sürüm artırılmalı (main: $base, bu PR: $head). scripts/surum.sh [patch|minor|major] çalıştır."
            exit 1
          fi
