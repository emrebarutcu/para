# Supabase'de SQL çalıştırır (supabase/sql.sh, Management API; anahtar Actions secret'ı SUPABASE_ACCESS_TOKEN). Elle
# verilen dosya .sh ise (supabase/apple.sh: Apple ile giriş) o betik çalışır.
# supabase/gecis/ altına yeni bir geçiş dosyası eklenip itilince o dosya kendiliğinden çalışır; elle de (Run workflow)
# istenen dosya çalıştırılabilir. Geçiş dosyaları yeniden çalıştırılabilir yazılır.
name: Supabase SQL

on:
  workflow_dispatch:
    inputs:
      dosya:
        description: "Çalıştırılacak SQL dosyası"
        default: "supabase/tablolar.sql"
  push:
    paths: ["supabase/gecis/*.sql"]

jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Çalıştır
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EVENT: ${{ github.event_name }}
          DOSYA: ${{ inputs.dosya }}
        run: |
          # Anahtar yoksa çalıştırılmaz (geçiş elle de çalıştırılabilir: SUPABASE_ACCESS_TOKEN=… sh supabase/sql.sh dosya)
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret'ı yok, SQL çalıştırılmadı: supabase.com/dashboard/account/tokens → Generate new token, GitHub → Settings → Secrets and variables → Actions'a ekle"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then files="$DOSYA"; else files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'supabase/gecis/*.sql'); fi
          [ -n "$files" ] || { echo "Çalıştırılacak dosya yok"; exit 0; }
          # .sh dosyası (ör. supabase/apple.sh: Auth ayarı) kendisi çalışır, .sql dosyası sql.sh ile
          for f in $files; do echo "== $f"; case "$f" in *.sh) sh "$f" ;; *) sh supabase/sql.sh "$f" ;; esac; done
