# iOS uygulamasını App Store Connect'e (TestFlight) yükler. Mac gerekmez: App Store Connect API anahtarıyla her çalışmada
# geçici bir dağıtım sertifikası ve App Store profili oluşturulur, arşiv imzasız alınıp codesign ile elle imzalanır, iş
# bitince sertifika ve profil silinir (ios/scripts/asc_imza.py; Xcode'un imzası neden kullanılmıyor orada yazılı). Kurulum: SETUP.md → TestFlight.
# Elle (Actions → TestFlight → Run workflow; dosya main'de olmalı) ya da testflight-* etiketiyle (her dalda) çalışır.
# macOS 26 makinesinde en yeni Xcode ile. Build numarası iş akışının çalışma sayısıdır, sürüm web sürümüdür (MARKETING_VERSION).
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["testflight-*"]

jobs:
  yukle:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD: ${{ github.run_number }}
      BUNDLE_ID: app.cashfollow.ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        # App Store Connect yalnızca güncel SDK ile yapılmış build'i kabul eder (Ekim 2026: iOS 26 SDK, Xcode 26): kurulu en yeni Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -1)   # beta Xcode ile yüklenen build reddedilir
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Anahtarlar
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "$(printenv $v)" ]; then
              echo "::error::$v boş: GitHub → Settings → Secrets and variables → Actions'ta APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID ve ASC_KEY_P8 olmalı (SETUP.md → TestFlight)"
              exit 1
            fi
          done
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography

      - name: Geçici sertifika ve profil
        run: |
          "$RUNNER_TEMP/venv/bin/python" ios/scripts/asc_imza.py olustur "$RUNNER_TEMP/imza"
          KC="$RUNNER_TEMP/imza.keychain-db"
          KCPASS=$(uuidgen)
          echo "::add-mask::$KCPASS"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            && security import "$RUNNER_TEMP/wwdr.cer" -k "$KC" || true
          security import "$RUNNER_TEMP/imza/anahtar.pem" -k "$KC" -t priv -f openssl -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/imza/sertifika.cer" -k "$KC" -t cert -f x509
          rm "$RUNNER_TEMP/imza/anahtar.pem"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

      - name: Arşivle (imzasız)
        run: |
          xcodebuild archive -project ios/CashFollow.xcodeproj -scheme CashFollow -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CashFollow.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet

      - name: İmzala ve paketle
        run: |
          W="$RUNNER_TEMP/ipa"
          rm -rf "$W" && mkdir -p "$W/Payload"
          cp -R "$RUNNER_TEMP/CashFollow.xcarchive/Products/Applications/CashFollow.app" "$W/Payload/"
          APP="$W/Payload/CashFollow.app"
          test -f "$APP/js/tools.js"
          cp "$RUNNER_TEMP/imza/profil.mobileprovision" "$APP/embedded.mobileprovision"
          # App Store yetkileri (Xcode'un App Store dışa aktarmasındakiyle aynı)
          cat > "$RUNNER_TEMP/yetkiler.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key><string>$TEAM_ID.$BUNDLE_ID</string>
            <key>com.apple.developer.team-identifier</key><string>$TEAM_ID</string>
            <key>beta-reports-active</key><true/>
            <key>get-task-allow</key><false/>
          </dict>
          </plist>
          PLIST
          # Gereksinim addan değil takım kimliğinden: addaki "ç" imzayı geçersiz kılıyordu (ITMS-90035)
          printf 'designated => anchor apple generic and identifier "%s" and certificate leaf[subject.OU] = "%s" and certificate 1[field.1.2.840.113635.100.6.2.1] /* exists */\n' \
            "$BUNDLE_ID" "$TEAM_ID" > "$RUNNER_TEMP/gereksinim.txt"
          codesign --force --sign "$CERT_SHA1" --keychain "$KEYCHAIN" --entitlements "$RUNNER_TEMP/yetkiler.plist" \
            --requirements "$RUNNER_TEMP/gereksinim.txt" --generate-entitlement-der --timestamp=none "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=|Sealed" || true
          codesign -d -r- "$APP" 2>&1 | grep designated || true
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true
          codesign --verify --deep --strict --verbose=2 "$APP"
          cd "$W" && zip -qry "$RUNNER_TEMP/CashFollow.ipa" Payload
          ls -la "$RUNNER_TEMP/CashFollow.ipa"

      - name: TestFlight'a yükle
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -f "$RUNNER_TEMP/CashFollow.ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --output-format normal
          echo "Yüklendi: sürüm $(sed -n "s/^self.APP_VERSION = '\(.*\)';/\1/p" version.js), build $BUILD. App Store Connect birkaç dakika işler, sonra TestFlight'ta görünür."

      - name: Apple'ın işlemesi
        # Yükleme başarılı olsa da Apple build'i işlerken reddedebilir (ör. eksik gizlilik bildirimi); sonucu bekler
        run: '"$RUNNER_TEMP/venv/bin/python" ios/scripts/asc_imza.py durum "$BUILD" 1200'

      - name: Temizlik
        if: always()
        run: |
          if [ -n "$CERT_ID$PROFILE_ID" ]; then "$RUNNER_TEMP/venv/bin/python" ios/scripts/asc_imza.py sil "$CERT_ID" "$PROFILE_ID" || true; fi
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$KEY_PATH" ~/.appstoreconnect/private_keys "$RUNNER_TEMP/imza"
