# iOS uygulamasını App Store Connect'e (TestFlight) yükler. Mac gerekmez: imza Apple'ın bulut sertifikasıyla, App Store
# Connect API anahtarıyla yapılır (Xcode otomatik imzalama, -allowProvisioningUpdates). Kurulum: SETUP.md → TestFlight.
# Elle (Actions → TestFlight → Run workflow; dosya main'de olmalı) ya da testflight-* etiketiyle (her dalda) çalışır.
# macOS 26 makinesinde en yeni Xcode ile. Build numarası iş akışının çalışma sayısıdır, sürüm web sürümüdür (MARKETING_VERSION).
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["testflight-*"]

jobs:
  yukle:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        # App Store Connect yalnızca güncel SDK ile yapılmış build'i kabul eder (Ekim 2026: iOS 26 SDK, Xcode 26): kurulu en yeni Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -1)   # beta Xcode ile yüklenen build reddedilir
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Anahtarlar
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "$(printenv $v)" ]; then
              echo "::error::$v boş: GitHub → Settings → Secrets and variables → Actions'ta APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID ve ASC_KEY_P8 olmalı (SETUP.md → TestFlight)"
              exit 1
            fi
          done
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Arşivle
        run: |
          xcodebuild -version
          xcodebuild archive -project ios/CashFollow.xcodeproj -scheme CashFollow -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CashFollow.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" -quiet
          # İmza paketin bütün dosyalarını (js/ dahil) kapsıyor mu; kopyalama imzadan sonra olursa burada yakalanır
          APP="$RUNNER_TEMP/CashFollow.xcarchive/Products/Applications/CashFollow.app"
          test -f "$APP/js/tools.js"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=" || true

      - name: Dışa aktar (App Store imzası)
        run: |
          sed -i '' 's|<string>upload</string>|<string>export</string>|' "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CashFollow.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          # Yüklenecek paketin imzası: dağıtım sertifikası (Apple Distribution) ve App Store profili olmalı
          cd "$RUNNER_TEMP" && rm -rf ipa && mkdir ipa && cd ipa && unzip -q ../export/CashFollow.ipa
          APP=Payload/CashFollow.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=|Format|CodeDirectory"
          codesign -d --entitlements - "$APP" 2>&1 | head -40
          security cms -D -i "$APP/embedded.mobileprovision" | grep -A1 -E "<key>(Name|ProvisionsAllDevices|get-task-allow|aps-environment)</key>" || true
          find "$APP" -type f | grep -v "/js/\|Assets.car\|_CodeSignature" | head -40

      - name: Hata kaydı
        if: failure()
        run: |
          for d in $(find "${TMPDIR:-/tmp}" /var/folders -name "*.xcdistributionlogs" -maxdepth 6 2>/dev/null); do
            echo "== $d"; ls "$d"; tail -80 "$d/IDEDistribution.standard.log" 2>/dev/null || true
          done

      - name: TestFlight'a yükle
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/CashFollow.ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --output-format normal
          echo "Yüklendi: sürüm $(sed -n "s/^self.APP_VERSION = '\(.*\)';/\1/p" version.js), build $BUILD. App Store Connect birkaç dakika işler, sonra TestFlight'ta görünür."

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$KEY_PATH" ~/.appstoreconnect/private_keys
