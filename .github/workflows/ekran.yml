# iOS ekran görüntüleri: simülatörde örnek veriyle (Uygulama/Ornek.swift) her sekme, grafikler ve formlar; Türkçe ve
# İngilizce (ABD), açık tema (koyu tema elle çalıştırınca seçilirse). Cihaz en yeni iPhone Pro Max: App Store 6,9 inç
# (1320 × 2868) görüntü ister, küçükleri bundan kendisi üretir.
# Görüntüler ekran-goruntuleri dalına yazılır (her çalışmada yeniden). claude/grafik* ve claude/abd* dallarına itilince ya da elle çalışır.
# App Store sayfası görüntüleri ekran-goruntuleri dalından yükler (magaza.yml): bir özelliği denemek için elle
# çalıştırırken "dal"a başka bir ad verilir (ör. ekran-karsilama), mağazanınkiler değişmez. "karsilama" yalnızca ilk
# açılış akışını çeker (Türkçe ve İngilizce; koyu seçiliyse koyu tema da).
name: Ekran görüntüleri

on:
  workflow_dispatch:
    inputs:
      koyu:
        description: "Koyu tema görüntüleri de"
        type: boolean
        default: false
      dal:
        description: "Görüntülerin yazılacağı dal (App Store ekran-goruntuleri dalından yükler)"
        type: string
        default: ekran-goruntuleri
      karsilama:
        description: "Yalnızca ilk açılış akışı (ara adımlar ve sonrasında Kartlar, Özet)"
        type: boolean
        default: false
  push:
    branches: ["claude/grafik*", "claude/abd*"]
    paths: ["ios/**", "*.js", "dil/**", ".github/workflows/ekran.yml"]

permissions:
  contents: write

jobs:
  ekran:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Derle
        run: |
          xcodebuild -project ios/CashFollow.xcodeproj -scheme CashFollow -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Ekran görüntüleri
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/CashFollow.app
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ids = [x["udid"] for rt, xs in sorted(d.items(), reverse=True) if "iOS" in rt for x in xs if x["name"].startswith("iPhone") and x["name"].endswith("Pro Max")]
          print(ids[0])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          DATA=$(xcrun simctl get_app_container "$UDID" app.cashfollow.ios data)
          ISARET="$DATA/Documents/tur-hazir"
          mkdir -p out "$DATA/Documents"
          # Tur: uygulama bir kez açılır, ekranları sırayla gösterir (Ornek.swift TurEkrani); her ekran hazır olunca
          # tur-hazir dosyasına adını yazar, görüntü alınıp dosya silinince sonrakine geçer. Sabit bekleme yok.
          tur() {  # önek, tema, adımlar (virgülle), uygulama argümanları…
            onek=$1; theme=$2; adimlar=$3; shift 3
            xcrun simctl ui "$UDID" appearance "$theme"
            xcrun simctl terminate "$UDID" app.cashfollow.ios 2>/dev/null || true
            rm -f "$ISARET"
            xcrun simctl launch "$UDID" app.cashfollow.ios -ornek -tur "$adimlar" "$@"
            for ad in $(echo "$adimlar" | tr ',' ' '); do
              for t in $(seq 1 600); do [ -f "$ISARET" ] && break; sleep 0.1; done
              [ -f "$ISARET" ] || { echo "zaman aşımı: $onek$ad"; return 1; }
              xcrun simctl io "$UDID" screenshot "out/$onek$(cat "$ISARET")-$theme.png" >/dev/null
              rm -f "$ISARET"
            done
          }
          TR='-AppleLanguages (tr) -AppleLocale tr_TR'
          EN='-AppleLanguages (en) -AppleLocale en_US'
          HEPSI=galeri1,galeri2,galeri3,galeri4,galeri5,galeri6,sekme0,sekme1,sekme2,sekme3,sekme4
          TANITIM=tanitim0,tanitim1,tanitim2,tanitim3,tanitim4
          if [ "${{ inputs.karsilama }}" = "true" ]; then
            # Ara adımlar (boş kart adı, seçilmemiş kesim günü) ve akıştan sonra Kartlar ile Özet
            AYRINTI=tanitim0,tanitim1bos,tanitim1,tanitim2bos,tanitim2,tanitim3,tanitim4,sekme3,sekme0
            tur "" light "$AYRINTI" -bos $TR
            tur en- light "$AYRINTI" -bos -ulke US $EN
            if [ "${{ inputs.koyu }}" = "true" ]; then
              tur "" dark "$AYRINTI" -bos $TR
              tur en- dark "$AYRINTI" -bos -ulke US $EN
            fi
            ls out
            exit 0
          fi
          tur "" light "$HEPSI" $TR
          tur bos- light sekme0 -bos $TR                 # verisi olmayan yeni kullanıcı (Başlarken)
          tur en- light sekme0,sekme1,sekme2,sekme3,sekme4,galeri3 -ulke US $EN
          tur en-bos- light sekme0 -bos -ulke US $EN
          # İlk açılış akışı (KarsilamaEkrani): beş ekran, cevaplar dolu
          tur "" light "$TANITIM" -bos $TR
          tur en- light "$TANITIM" -bos -ulke US $EN
          # CashFollow Premium ödeme ekranı ve kilitler (ücretsiz sürüm); en-ucretsiz-galeri7 App Store incelemesinin
          # her abonelik için istediği görüntü
          tur en-ucretsiz- light galeri7,galeri8,sekme0,sekme1 -ucretsiz -ulke US $EN
          tur ucretsiz- light galeri7 -ucretsiz $TR
          # Koyu tema yalnızca elle çalıştırınca istenirse (Actions → Ekran görüntüleri → koyu)
          if [ "${{ inputs.koyu }}" = "true" ]; then tur "" dark "$HEPSI" $TR; fi
          ls out
      - name: Görüntüleri yaz
        env:
          DAL: ${{ inputs.dal || 'ekran-goruntuleri' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan "$DAL"
          git rm -rq --cached .
          mkdir -p /tmp/ekran && cp out/*.png /tmp/ekran/
          git clean -fdxq -e out
          cp /tmp/ekran/*.png .
          echo "Kaynak: $GITHUB_SHA" > KAYNAK.txt
          git add *.png KAYNAK.txt
          git commit -qm "Ekran görüntüleri ($GITHUB_SHA)"
          git push -f origin "$DAL"
