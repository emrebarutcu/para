<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6aa9ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Para" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Para</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">₺</span>
      <h1>para</h1>
    </div>
    <div class="month-nav" title="Planın başladığı ay">
      <button id="prevMonth" class="icon-btn" aria-label="Önceki ay">‹</button>
      <input type="month" id="monthPicker" aria-label="Başlangıç ayı" />
      <button id="nextMonth" class="icon-btn" aria-label="Sonraki ay">›</button>
    </div>
    <div class="actions">
      <button id="themeBtn" class="ghost icon-btn" aria-label="Tema değiştir" title="Tema değiştir">☀</button>
      <button id="authBtn" class="ghost small">☁ Giriş</button>
      <button id="exportBtn" class="ghost">Dışa Aktar</button>
      <label class="ghost file-label" title="JSON yedeği ya da Taksitler Excel dosyası">
        İçe Aktar
        <input type="file" id="importInput" accept=".json,.xlsx,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
      </label>
    </div>
  </header>

  <section class="summary">
    <div class="card net">
      <span class="label" id="dueLabel">Bu ay</span>
      <span class="value" id="dueTotal">₺0,00</span>
    </div>
    <div class="card">
      <span class="label" id="nextLabel">Sonraki ay</span>
      <span class="value" id="nextTotal">₺0,00</span>
    </div>
    <div class="card">
      <span class="label">Kalan borç</span>
      <span class="value" id="remainingTotal">₺0,00</span>
    </div>
    <div class="card">
      <span class="label">Son taksit</span>
      <span class="value" id="endLabel">—</span>
    </div>
  </section>

  <section class="chart-section">
    <div class="chart-head">
      <h2>Aylık ödeme planı</h2>
      <div class="chart-legend" id="chartLegend"></div>
    </div>
    <div class="chart-wrap">
      <svg id="planChart" class="chart-svg" role="img" aria-label="Aylık taksit ödemeleri, kişilere göre"></svg>
      <p id="chartEmpty" class="empty" hidden></p>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Ödeme tablosu</h2>
      <label class="due-day">
        Son ödeme günü
        <input type="number" id="dueDay" min="1" max="31" step="1" />
      </label>
    </div>
    <div class="table-wrap">
      <table id="planTable" class="plan-table"></table>
    </div>
  </section>

  <section class="panel installments">
    <div class="panel-head">
      <h2>Taksitler</h2>
      <button id="addPerson" class="ghost small">+ Kişi</button>
    </div>
    <div class="person-tabs" id="personTabs" role="tablist"></div>
    <div class="person-bar" id="personBar">
      <span class="person-stats" id="personStats"></span>
      <button id="renamePerson" class="ghost small">Adını değiştir</button>
      <button id="deletePerson" class="ghost small">Sil</button>
    </div>
    <ul class="inst-list" id="instList"></ul>
    <form id="instForm" class="inst-form">
      <label class="fld fld-desc">
        <span>Ürün</span>
        <input name="desc" type="text" placeholder="örn. IKEA" required />
      </label>
      <label class="fld">
        <span>Ekstre</span>
        <input name="statement" type="month" required />
      </label>
      <label class="fld">
        <span>Taksit</span>
        <input name="count" type="number" min="1" max="60" step="1" placeholder="Kalan" required />
      </label>
      <label class="fld">
        <span>Tutar</span>
        <input name="amount" type="number" min="0.01" step="0.01" placeholder="0,00" required />
      </label>
      <label class="fld">
        <span>Tutar türü</span>
        <select name="mode">
          <option value="total">Toplam</option>
          <option value="per">Taksit tutarı</option>
        </select>
      </label>
      <label class="fld" title="Alışverişin asıl taksit sayısı (ör. 6 taksitin son 4'ü kaldıysa 6). Orijinal tutarı hesaplamak için.">
        <span>Plan (ops.)</span>
        <input name="planCount" type="number" min="1" max="60" step="1" placeholder="—" />
      </label>
      <div class="fld-actions">
        <button type="submit" id="instSubmit">Ekle</button>
        <button type="button" id="instCancel" class="ghost" hidden>İptal</button>
      </div>
    </form>
    <p class="inst-preview" id="instPreview"></p>
  </section>

  <!-- Auth modal -->
  <div id="authModal" class="modal-wrap" hidden>
    <div id="authOverlay" class="modal-overlay"></div>
    <div class="modal-box">
      <div class="modal-head">
        <h2>Cloud Sync</h2>
        <button id="authClose" class="ghost small">✕</button>
      </div>

      <div id="authLoginForm">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Giriş Yap</button>
          <button class="auth-tab" data-tab="register">Kayıt Ol</button>
        </div>
        <form id="authForm">
          <input id="authEmail" type="email" placeholder="E-posta" autocomplete="email" required />
          <input id="authPassword" type="password" placeholder="Şifre" autocomplete="current-password" minlength="6" required />
          <button type="submit" id="authSubmitBtn">Giriş Yap</button>
        </form>
        <p id="authMsg" class="auth-msg"></p>
        <button type="button" id="forgotBtn" class="ghost small auth-forgot">Şifremi unuttum</button>
      </div>

      <div id="authForgotForm" hidden>
        <p class="modal-desc">E-postana şifre sıfırlama linki gönderilir.</p>
        <form id="forgotForm">
          <input id="forgotEmail" type="email" placeholder="E-posta" autocomplete="email" required />
          <button type="submit">Link gönder</button>
        </form>
        <p id="forgotMsg" class="auth-msg"></p>
        <button type="button" id="backToLoginBtn" class="ghost small auth-forgot">← Geri</button>
      </div>

      <div id="authResetForm" hidden>
        <p class="modal-desc">Yeni şifreni belirle.</p>
        <form id="resetForm">
          <input id="newPassword" type="password" placeholder="Yeni şifre" minlength="6" required />
          <button type="submit">Şifreyi güncelle</button>
        </form>
        <p id="resetMsg" class="auth-msg"></p>
      </div>

      <div id="authLoggedIn" hidden>
        <p class="modal-desc">Giriş yapıldı:</p>
        <p id="authUserEmail" class="auth-user-email"></p>
        <button id="authLogoutBtn" class="ghost">Çıkış Yap</button>
      </div>
    </div>
  </div>

  <!-- Chart tooltip -->
  <div id="chartTooltip" class="chart-tooltip" hidden></div>

  <!-- Scripts: config → supabase SDK → sync → taksit → app -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="sync.js"></script>
  <script src="taksit.js"></script>
  <script src="app.js"></script>
</body>
</html>
