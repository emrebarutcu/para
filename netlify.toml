[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Supabase SQL dosyaları yayınlanmaz (Cloudflare için .assetsignore)
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true
